apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-viewer
  namespace: ai-agent
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: agent-viewer-token
  namespace: ai-agent
  annotations:
    kubernetes.io/service-account.name: agent-viewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-viewer-binding
subjects:
- kind: ServiceAccount
  name: agent-viewer
  namespace: ai-agent
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-edit
  namespace: ai-agent
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: agent-edit-token
  namespace: ai-agent
  annotations:
    kubernetes.io/service-account.name: agent-edit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-edit-binding
subjects:
- kind: ServiceAccount
  name: agent-edit
  namespace: ai-agent
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-admin
  namespace: ai-agent
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: agent-admin-token
  namespace: ai-agent
  annotations:
    kubernetes.io/service-account.name: agent-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-admin-binding
subjects:
- kind: ServiceAccount
  name: agent-admin
  namespace: ai-agent
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-token-reader
  namespace: ai-agent
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
  - agent-viewer-token
  - agent-edit-token
  - agent-admin-token
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-default-token-reader
  namespace: ai-agent
subjects:
- kind: ServiceAccount
  name: ai-agent
  namespace: ai-agent
roleRef:
  kind: Role
  name: agent-token-reader
  apiGroup: rbac.authorization.k8s.io
