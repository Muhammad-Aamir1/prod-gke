apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prod-gke-ai-agent
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: prod
            url: https://kubernetes.default.svc
  template:
    metadata:
      name: prod-gke-ai-agent
      labels:
        environment: production
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/name: ai-agent
    spec:
      project: default
      source:
        repoURL: https://github.com/Muhammad-Aamir1/prod-gke.git
        targetRevision: main
        path: apps/ai-agent
      destination:
        server: "{{url}}"
        namespace: ai-agent
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      revisionHistoryLimit: 5
