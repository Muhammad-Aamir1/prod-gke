apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-gke-monitoring
  namespace: argocd
  labels:
    environment: all
    app.kubernetes.io/managed-by: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Muhammad-Aamir1/prod-gke.git
    targetRevision: main
    path: 04-monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 5
