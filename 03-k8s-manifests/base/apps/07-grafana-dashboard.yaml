apiVersion: v1
kind: ConfigMap
metadata:
  name: prod-gke-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  prod-gke-dashboard.json: |
    {
      "title": "prod-gke Overview",
      "tags": ["prod-gke", "kubernetes", "nodejs"],
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 1,
      "panels": [
        {
          "title": "Cluster CPU Usage",
          "type": "gauge",
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
          "targets": [{"expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "CPU %"}]
        },
        {
          "title": "Cluster Memory Usage",
          "type": "gauge",
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0},
          "targets": [{"expr": "(1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)) * 100", "legendFormat": "Memory %"}]
        },
        {
          "title": "Node Count",
          "type": "stat",
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0},
          "targets": [{"expr": "count(kube_node_info)", "legendFormat": "Nodes"}]
        },
        {
          "title": "Running Pods",
          "type": "stat",
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 0},
          "targets": [{"expr": "count(kube_pod_status_phase{phase=\"Running\"})", "legendFormat": "Pods"}]
        },
        {
          "title": "Backend CPU",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 6},
          "targets": [{"expr": "rate(process_cpu_seconds_total{app=\"backend\"}[1m])", "legendFormat": "{{pod}}"}]
        },
        {
          "title": "Frontend CPU",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 6},
          "targets": [{"expr": "rate(process_cpu_seconds_total{app=\"frontend\"}[1m])", "legendFormat": "{{pod}}"}]
        },
        {
          "title": "Backend Memory",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 12},
          "targets": [{"expr": "process_resident_memory_bytes{app=\"backend\"}", "legendFormat": "{{pod}}"}]
        },
        {
          "title": "Frontend Memory",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 12},
          "targets": [{"expr": "process_resident_memory_bytes{app=\"frontend\"}", "legendFormat": "{{pod}}"}]
        },
        {
          "title": "Event Loop Lag (Backend)",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 18},
          "targets": [{"expr": "nodejs_eventloop_lag_seconds{app=\"backend\"}", "legendFormat": "{{pod}}"}]
        },
        {
          "title": "Event Loop Lag (Frontend)",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 18},
          "targets": [{"expr": "nodejs_eventloop_lag_seconds{app=\"frontend\"}", "legendFormat": "{{pod}}"}]
        },
        {
          "title": "Backend Heap",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 24},
          "targets": [{"expr": "process_heap_bytes{app=\"backend\"}", "legendFormat": "{{pod}}"}]
        },
        {
          "title": "Frontend Heap",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 24},
          "targets": [{"expr": "process_heap_bytes{app=\"frontend\"}", "legendFormat": "{{pod}}"}]
        },
        {
          "title": "Open FDs (Backend)",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 30},
          "targets": [{"expr": "process_open_fds{app=\"backend\"}", "legendFormat": "{{pod}}"}]
        },
        {
          "title": "Open FDs (Frontend)",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 30},
          "targets": [{"expr": "process_open_fds{app=\"frontend\"}", "legendFormat": "{{pod}}"}]
        }
      ]
    }
