# ~/prod-gke/03-k8s-manifests/apps/02-backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: prod-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # SECURITY: Binds to GCP IAM
      serviceAccountName: backend-ksa 
      # ARCHITECT RULE: Pin to Standard Node Pool
      nodeSelector:
        finops.tier: backend
      containers:
      - name: api
        image: nginx:alpine # Placeholder for your compiled Go/Node.js app
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        # RELIABILITY: Readiness probe prevents routing to broken pods
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: prod-ns
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
