# ~/prod-gke/03-k8s-manifests/apps/04-gateway.yaml
---
# 1. The Gateway provisions the actual Google Cloud Load Balancer
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: external-http-gw
  namespace: prod-ns
spec:
  gatewayClassName: gke-l7-gxlb # This specific class triggers a Global External HTTP(S) LB in GCP
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
# 2. The HTTPRoute defines the traffic rules (Path -> Service)
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: prod-ns
spec:
  parentRefs:
  - name: external-http-gw
  rules:
  - backendRefs:
    - name: frontend-svc
      port: 80
---
# 3. Security & Performance: Attach Cloud Armor & CDN to the Frontend Service
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: frontend-backend-policy
  namespace: prod-ns
spec:
  default:
    securityPolicy: "prod-waf-policy" # References the policy you just created via gcloud
  targetRef:
    group: ""
    kind: Service
    name: frontend-svc
