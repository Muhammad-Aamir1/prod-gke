---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: prod-cert
  namespace: prod-ns
spec:
  domains:
    - REPLACE_WITH_YOUR_DOMAIN.com
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: external-http-gw
  namespace: prod-ns
  annotations:
    networking.gke.io/managed-certificates: "prod-cert"
spec:
  gatewayClassName: gke-l7-gxlb
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
    allowedRoutes:
      namespaces:
        from: Same
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: prod-ns
spec:
  parentRefs:
  - name: external-http-gw
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: prod-ns
spec:
  parentRefs:
  - name: external-http-gw
    sectionName: https
  rules:
  - backendRefs:
    - name: frontend-svc
      port: 80

