---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: prod-ns
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-store
    kind: SecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: postgres-user
  - secretKey: password
    remoteRef:
      key: postgres-password
