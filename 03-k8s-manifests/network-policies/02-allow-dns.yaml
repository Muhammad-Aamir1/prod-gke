# ~/prod-gke/03-k8s-manifests/network-policies/02-allow-dns.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: prod-ns
spec:
  podSelector: {} # Applies to all pods in prod-ns
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system # The namespace where CoreDNS lives
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
